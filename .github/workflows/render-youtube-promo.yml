name: Render YouTube promo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render-youtube-promo.py'
      - 'docs/assets/app-icon.png'
      - 'docs/assets/my-alt-tab-demo.gif'
      - '.github/workflows/render-youtube-promo.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.repository == 'zhangqiaoran/my-alt-tab'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/youtube-venv"
          "$RUNNER_TEMP/youtube-venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/youtube-venv/bin/python" -m pip install --quiet pillow numpy imageio imageio-ffmpeg

      - name: Render 1080p promo and thumbnail
        run: |
          "$RUNNER_TEMP/youtube-venv/bin/python" scripts/render-youtube-promo.py
          test -s docs/assets/my-alt-tab-youtube-promo.mp4
          test -s docs/assets/my-alt-tab-youtube-thumbnail.png
          file docs/assets/my-alt-tab-youtube-promo.mp4
          file docs/assets/my-alt-tab-youtube-thumbnail.png
          ls -lh docs/assets/my-alt-tab-youtube-promo.mp4 docs/assets/my-alt-tab-youtube-thumbnail.png

      - name: Publish video assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/assets/my-alt-tab-youtube-promo.mp4 docs/assets/my-alt-tab-youtube-thumbnail.png
          if git diff --cached --quiet; then
            echo "YouTube promo assets are already current."
            exit 0
          fi

          git commit -m "docs(marketing): publish YouTube promo video and thumbnail [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload YouTube package
        uses: actions/upload-artifact@v4
        with:
          name: my-alt-tab-youtube-promo
          path: |
            docs/assets/my-alt-tab-youtube-promo.mp4
            docs/assets/my-alt-tab-youtube-thumbnail.png
            docs/youtube-promo-copy.md
          if-no-files-found: error
          retention-days: 30
