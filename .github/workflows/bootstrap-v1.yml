name: Bootstrap WindowHop v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-v1.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'zhangqiaoran/windowhop-optimized'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v1.0.0 source tree
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/part-*.patch > /tmp/windowhop-v1.patch

          git clone --depth 1 --branch v1.6.0 \
            https://github.com/martonpaulo/windowhop.git /tmp/windowhop-upstream

          cd /tmp/windowhop-upstream
          git apply --check /tmp/windowhop-v1.patch
          git apply /tmp/windowhop-v1.patch

          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/windowhop-upstream/ ./

          rm -f .github/workflows/release.yml

      - name: Add project screenshots section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename, title in [('README.md', 'Screenshots'), ('README.zh-CN.md', '界面预览')]:
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text()
              marker = '<!-- WINDOWHOP_SCREENSHOTS -->'
              if marker in text:
                  continue

              if filename == 'README.md':
                  block = r'''
## Screenshots

<!-- WINDOWHOP_SCREENSHOTS -->

### Settings & multi-display configuration

The settings panel exposes multi-display behavior, preview mode and preview-row alignment in one place.

![WindowHop settings and multi-display configuration](docs/images/windowhop-settings.png)

### Window switching

The switcher displays large live thumbnails from windows across all connected displays, while the switcher panel itself appears only on the display containing the mouse pointer.

![WindowHop window switching](docs/images/windowhop-switcher.png)

'''
              else:
                  block = r'''
## 界面预览

<!-- WINDOWHOP_SCREENSHOTS -->

### 设置与多显示器配置

设置页集中提供多显示器行为、窗口缩略图模式以及缩略图左 / 中 / 右对齐等选项。

![WindowHop 设置与多显示器配置](docs/images/windowhop-settings.png)

### 窗口切换效果

切换器可以加载所有显示器上的窗口缩略图，但切换面板本身只会出现在鼠标当前所在的显示器上。

![WindowHop 窗口切换效果](docs/images/windowhop-switcher.png)

'''
              insert_at = text.find('\n## ')
              if insert_at == -1:
                  text += '\n' + block
              else:
                  # keep project introduction first, then screenshots
                  second = text.find('\n## ', insert_at + 4)
                  pos = second if second != -1 else len(text)
                  text = text[:pos] + '\n' + block + text[pos:]
              p.write_text(text)
          PY

          mkdir -p docs/images
          cat > docs/images/README.md <<'EOF'
          # Screenshot assets

          Expected README assets:

          - windowhop-settings.png — Settings / multi-display / preview configuration.
          - windowhop-switcher.png — Window switcher in use.

          These names are referenced by both README files.
          EOF

      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zhangqiaoran"
          git config user.email "liuzijiang_work@163.com"

          git add -A
          git commit -m "release: WindowHop v1.0.0 by zhangqiaoran"
          git push origin HEAD:main

          if ! git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            git tag -a v1.0.0 -m "WindowHop v1.0.0"
            git push origin v1.0.0
          fi
