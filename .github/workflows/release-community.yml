name: Release my-alt-tab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release/**'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'zhangqiaoran/my-alt-tab'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          test -f ".release/v${VERSION}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Support/Info.plist)" = "my-alt-tab"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Support/Info.plist)" = "com.zhangqiaoran.myalttab"
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Support/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: swift test

      - name: Repository validation
        run: scripts/validate.sh

      - name: Package ad-hoc signed app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          chmod +x scripts/package-app.sh
          MY_ALT_TAB_UNIVERSAL=1 ./scripts/package-app.sh "$VERSION"
          codesign --verify --deep --strict --verbose=2 build/my-alt-tab.app
          scripts/verify-release-identity.sh build/my-alt-tab.app
          shasum -a 256 "artifacts/my-alt-tab-${VERSION}.zip" > "artifacts/my-alt-tab-${VERSION}.zip.sha256"

      - name: Sign Sparkle update
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "${SPARKLE_PRIVATE_KEY:-}" || {
            echo "::error::Missing SPARKLE_PRIVATE_KEY repository secret"
            exit 1
          }
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="artifacts/my-alt-tab-${VERSION}.zip"
          SIGN_UPDATE=$(find .build -path '*/artifacts/sparkle/Sparkle/bin/sign_update' -type f -print -quit)
          test -n "$SIGN_UPDATE" || {
            echo "::error::Sparkle sign_update tool not found"
            exit 1
          }
          chmod +x "$SIGN_UPDATE"
          KEY_FILE="$RUNNER_TEMP/my-alt-tab-sparkle-private-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIGNATURE=$("$SIGN_UPDATE" -p --ed-key-file "$KEY_FILE" "$ZIP" | tr -d '\r\n ')
          test -n "$SIGNATURE"
          LENGTH=$(stat -f%z "$ZIP")
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"

      - name: Remove superseded 3.5/3.6 releases
        if: steps.version.outputs.version == '3.4.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for TAG in v3.5.0 v3.6.0; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --cleanup-tag -y
            elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git push origin ":refs/tags/$TAG"
            fi
          done

          for TAG in v3.5.0 v3.6.0; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::Release $TAG still exists"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG still exists"
              exit 1
            fi
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ZIP="artifacts/my-alt-tab-${VERSION}.zip"
          SHA="artifacts/my-alt-tab-${VERSION}.zip.sha256"
          NOTES="RELEASE_NOTES_v${VERSION}.md"

          # Keep the public release tag on the exact commit whose docs and
          # release metadata were validated by this job.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
            gh release edit "$TAG" --title "my-alt-tab ${VERSION}" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --target "$GITHUB_SHA" \
              --title "my-alt-tab ${VERSION}" \
              --notes-file "$NOTES"
          fi

      - name: Publish Sparkle appcast
        env:
          SPARKLE_SIGNATURE: ${{ steps.sparkle.outputs.signature }}
          SPARKLE_LENGTH: ${{ steps.sparkle.outputs.length }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          ZIP="artifacts/my-alt-tab-${VERSION}.zip"
          ATTRS="sparkle:edSignature=\"$SPARKLE_SIGNATURE\" length=\"$SPARKLE_LENGTH\""
          scripts/make-appcast.sh "$VERSION" "$BUILD_NUMBER" "$ZIP" "$ATTRS"

          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml already contains $VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(updates): publish appcast for v$VERSION [skip ci]"
          git push origin HEAD:main
