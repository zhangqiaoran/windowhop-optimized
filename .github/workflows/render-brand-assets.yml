name: Render README brand assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Support/AppIconSource.png'
      - 'scripts/render-brand-assets.py'
      - '.github/workflows/render-brand-assets.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.repository == 'zhangqiaoran/my-alt-tab'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: |
          python3 -m venv "$RUNNER_TEMP/brand-venv"
          "$RUNNER_TEMP/brand-venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/brand-venv/bin/python" -m pip install --quiet pillow

      - name: Render hero, icon and GIF
        run: |
          "$RUNNER_TEMP/brand-venv/bin/python" scripts/render-brand-assets.py Support/AppIconSource.png
          test -s docs/assets/my-alt-tab-hero.png
          test -s docs/assets/my-alt-tab-demo.gif
          test -s docs/assets/app-icon.png
          file docs/assets/my-alt-tab-hero.png
          file docs/assets/my-alt-tab-demo.gif
          ls -lh docs/assets/my-alt-tab-hero.png docs/assets/my-alt-tab-demo.gif docs/assets/app-icon.png

      - name: Publish generated README assets
        shell: bash
        run: |
          if git diff --quiet -- docs/assets/my-alt-tab-hero.png docs/assets/my-alt-tab-demo.gif docs/assets/app-icon.png docs/assets/favicon.png; then
            echo "Brand assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/my-alt-tab-hero.png docs/assets/my-alt-tab-demo.gif docs/assets/app-icon.png docs/assets/favicon.png
          git commit -m "docs(brand): publish hero and animated README demo [skip ci]"

          # README/script commits may land while rendering. Retry the
          # rebase/push hand-off so generated binary assets never lose a race
          # against nearby documentation/version commits.
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced main; retrying ($attempt/4)"
            sleep 2
          done
          echo "::error::Unable to publish generated README assets after retries"
          exit 1
