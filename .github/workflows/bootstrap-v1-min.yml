name: Bootstrap v1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-v1-min.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble source
        shell: bash
        run: |
          set -euxo pipefail
          cat .bootstrap/part-*.patch > /tmp/windowhop.patch
          git clone --depth 1 --branch v1.6.0 https://github.com/martonpaulo/windowhop.git /tmp/upstream
          cd /tmp/upstream
          git apply --check /tmp/windowhop.patch
          git apply /tmp/windowhop.patch
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=.git /tmp/upstream/ ./
          rm -f .github/workflows/release.yml

      - name: Commit source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name zhangqiaoran
          git config user.email liuzijiang_work@163.com
          git add -A
          git commit -m "release: WindowHop v1.0.0 by zhangqiaoran"
          git push origin HEAD:main

      - name: Tag v1.0.0
        shell: bash
        run: |
          set -euxo pipefail
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            git tag -a v1.0.0 -m "WindowHop v1.0.0"
            git push origin v1.0.0
          fi
