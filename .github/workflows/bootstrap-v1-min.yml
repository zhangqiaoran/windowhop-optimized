name: Import upstream source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v1-min.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import WindowHop v1.6.0 source tree
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.6.0 https://github.com/martonpaulo/windowhop.git /tmp/upstream
          rsync -a --exclude=.git --exclude=.github/workflows /tmp/upstream/ ./
          git config user.name zhangqiaoran
          git config user.email liuzijiang_work@163.com
          git add -A
          git commit -m "chore: import WindowHop v1.6.0 source base"
          git push origin HEAD:main
