name: Bootstrap my-alt-tab v1.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v1-min.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild canonical my-alt-tab v1.1.0 source tree
        shell: bash
        run: |
          set -euxo pipefail

          # Use the exact source archive line on which this release was developed.
          git clone --depth 1 --branch v1.6.0 https://github.com/martonpaulo/windowhop.git /tmp/upstream
          mkdir -p /tmp/final
          rsync -a --exclude='.git/' /tmp/upstream/ /tmp/final/

          # The direct patch was generated and locally round-trip tested against
          # the original v1.6.0 source, then Swift-parsed across all 70 source/test files.
          cat "$GITHUB_WORKSPACE"/.bootstrap-direct/part-*.b64 | tr -d '\n' | base64 -d > /tmp/my-alt-tab.patch.gz
          gzip -dc /tmp/my-alt-tab.patch.gz > /tmp/my-alt-tab.patch

          cd /tmp/final
          git init
          git config user.name zhangqiaoran
          git config user.email liuzijiang_work@163.com
          git add -A
          git commit -m "base: upstream v1.6.0"
          git apply --binary --check /tmp/my-alt-tab.patch
          git apply --binary /tmp/my-alt-tab.patch

          # Workflow files are managed by the connected GitHub account rather than
          # rewritten by GitHub's ephemeral Actions token.
          rm -rf /tmp/final/.github/workflows

          cd "$GITHUB_WORKSPACE"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/final/ ./

          rm -rf .bootstrap .bootstrap-v11 .bootstrap-v11-code .bootstrap-v11-code2 .bootstrap-v11-final .bootstrap-direct

          git config user.name zhangqiaoran
          git config user.email liuzijiang_work@163.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release: my-alt-tab v1.1.0 source by zhangqiaoran"
            git push origin HEAD:main
          fi
